name: ma-mag

networks:
  gateway-net:
    name: gateway-net

include:
  - ./services/auth-service/docker-compose.yml
  - ./services/order-service/docker-compose.yml

services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - gateway-net
    depends_on:
      - auth-proxy
      - order-proxy
