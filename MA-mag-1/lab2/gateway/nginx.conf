events { worker_connections 1024; }

http {
    log_format json_analytics escape=json '{'
        '"@timestamp": "$time_iso8601",'
        '"service.name": "api-gateway",'
        '"log.level": "INFO",'
        '"client_ip": "$remote_addr",'
        '"request_method": "$request_method",'
        '"request_uri": "$request_uri",'
        '"status": $status,'
        '"response_time_ms": $request_time,'
        '"trace.id": "$http_x_correlation_id"'
    '}';

    access_log /dev/stdout json_analytics;
    error_log /dev/stderr warn;

    server {
        listen 80;

        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = "") {
            set $correlation_id $request_id;
        }

        location /api/auth/ {
            proxy_pass http://auth-proxy:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/orders/ {
            proxy_pass http://order-proxy:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }
    }
}
